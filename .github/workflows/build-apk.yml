name: Build Stutosed Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (release or debug)'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 📱 Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: 🟢 Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'mobile/package-lock.json'

      - name: 📦 Install Mobile Dependencies
        run: |
          cd mobile
          npm install

      - name: 🔨 Generate Native Android Project
        run: |
          cd mobile
          npx expo prebuild --platform android --clean

      - name: ⚙️ Make Gradlew Executable
        run: chmod +x mobile/android/gradlew

      - name: 🚀 Build Android Release APK
        if: "${{ github.event_name != 'workflow_dispatch' || inputs.build_type == 'release' }}"
        run: |
          cd mobile/android
          ./gradlew assembleRelease --no-daemon

      - name: 🚀 Build Android Debug APK
        if: "${{ github.event_name == 'workflow_dispatch' && inputs.build_type == 'debug' }}"
        run: |
          cd mobile/android
          ./gradlew assembleDebug --no-daemon

      - name: 🔍 Find and Rename APK
        run: |
          mkdir -p build_output
          if [ -f mobile/android/app/build/outputs/apk/release/app-release.apk ]; then
            cp mobile/android/app/build/outputs/apk/release/app-release.apk build_output/stutosed-release.apk
          elif [ -f mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk build_output/stutosed-release.apk
          elif [ -f mobile/android/app/build/outputs/apk/debug/app-debug.apk ]; then
            cp mobile/android/app/build/outputs/apk/debug/app-debug.apk build_output/stutosed-debug.apk
          fi
          ls -lah build_output/

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: stutosed-android-apk
          path: build_output/*.apk

      - name: 🚀 Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build_output/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
